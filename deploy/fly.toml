# fly.toml app configuration file generated for tackstage on 2025-12-30T09:51:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tackstage'
primary_region = 'fra'

[build]
image = 'ghcr.io/the-technat/tackstage:sha-2538fa5'

[deploy]
strategy = 'rolling'

[http_service]
internal_port = 7007
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '2s'
method = 'GET'
path = '/'

[[vm]]
memory = '512mb'
cpus = 1
