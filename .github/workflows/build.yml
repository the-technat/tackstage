name: Build
on:
  push:
    paths:
      - packages
      - plugins
      - package.json
      - tsconfig.json
      - yarn.lock
      - .github/workflows/build.yml
  pull_request:
    paths:
      - packages
      - plugins
      - package.json
      - tsconfig.json
      - yarn.lock
      - .github/workflows/build.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }} 
    steps:
      - name: Get code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'
      - run: corepack enable
      - run: corepack install
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn build:backend
      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
      - name: Build image 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ${{ steps.meta.outputs.tags }}
  deploy:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_API_TOKEN }}
    runs-on: ubuntu-latest
    concurrency: prod
    environment: prod
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy Prod app
        working-directory: deploy
        run: flyctl deploy --remote-only --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} 